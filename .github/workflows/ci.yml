name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, development ]
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # Run every destination even when one fails, so a wireframe layout golden
      # that only moved on one device is reported alongside the others rather
      # than masking them.
      fail-fast: false
      matrix:
        # One device per OS. The axis worth covering is the OS, not the screen:
        # SensitiveViewManager forks at `#available(iOS 26.0, *)`, and below 26 the
        # entire layer walk is absent, so SwiftUI content is found by a different
        # code path. Extra devices on the same OS re-run the same path.
        #
        # iPhone 17 does not exist on the 18.0 runtime, so the older leg uses the
        # closest equivalent from the iPhone 16 family.
        #
        # Wireframe layout goldens are recorded per destination, under
        # MixpanelSessionReplayTests/Wireframe/Golden/Layout/<key>/, where the key
        # is derived from OS version + logical screen size + scale. Adding a
        # destination means recording its directory (run the suite once; a missing
        # golden is written and passes); removing one means deleting its directory.
        #
        # Xcode is a matrix axis too: the Xcode 26 legs prove the older toolchain
        # still builds, and the Xcode 27 leg proves the iOS 15 floor satisfies
        # Xcode 27's deployment-target range. Xcode 27 runs on the `xcode-27` runner.
        include:
          # Latest Xcode 26.x
          - { platform: iOS, os: '26.2', xcode: '26',   runner: macos-26, destination: 'name=iPhone 17,OS=26.2' }
          - { platform: iOS, os: '18.0', xcode: '26',   runner: macos-26, destination: 'name=iPhone 16,OS=18.0' }
          # Xcode 27
          - { platform: iOS, os: '27.0', xcode: '27.0', runner: xcode-27, destination: 'name=iPhone 17,OS=27.0' }
    name: ${{ matrix.platform }} ${{ matrix.os }} (Xcode ${{ matrix.xcode }})
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1
      with:
        xcode-version: ${{ matrix.xcode }}
    - name: Ensure the simulator runtime is present
      # The pinned Xcode ships only its own iOS runtime, so the older leg needs one
      # the image may not carry. Try to fetch it, and if it still is not there, say
      # so plainly -- xcodebuild's own error for a missing runtime is just
      # "Unable to find a device matching the provided destination specifier", which
      # reads like a typo in the destination rather than a missing download.
      run: |
        OS_VERSION="$(printf '%s' "${{ matrix.destination }}" | sed -n 's/.*OS=\([0-9.]*\).*/\1/p')"
        if xcrun simctl list runtimes | grep -q "iOS ${OS_VERSION}"; then
          echo "iOS ${OS_VERSION} runtime already present"
          exit 0
        fi
        echo "iOS ${OS_VERSION} runtime missing; attempting download"
        xcodebuild -downloadPlatform iOS -buildVersion "${OS_VERSION}" || true
        if ! xcrun simctl list runtimes | grep -q "iOS ${OS_VERSION}"; then
          echo "::error::iOS ${OS_VERSION} simulator runtime is unavailable on this image."
          echo "Available runtimes:"; xcrun simctl list runtimes
          exit 1
        fi

    - name: Run Test
      working-directory: MixpanelSessionReplay
      run: |
        set -o pipefail
        xcodebuild -scheme MixpanelSessionReplay -derivedDataPath Build/ -destination "${{ matrix.destination }}" -configuration Debug ONLY_ACTIVE_ARCH=NO ENABLE_TESTABILITY=YES -enableCodeCoverage YES -retry-tests-on-failure -test-iterations 3 clean build test | xcpretty -c;
    - name: Fail if a layout golden was recorded rather than compared
      # A missing golden is written and the test passes, which is right locally
      # but would let an unreviewed golden slip through CI. Anything new here
      # means this destination had no recorded goldens.
      run: |
        if [ -n "$(git status --porcelain MixpanelSessionReplay/MixpanelSessionReplayTests/Wireframe/Golden)" ]; then
          echo "::error::Wireframe goldens were created or modified during the test run:"
          git status --porcelain MixpanelSessionReplay/MixpanelSessionReplayTests/Wireframe/Golden
          echo "Record them locally and commit them."
          exit 1
        fi

  pod-lint:
    name: pod lib lint (Xcode 27.0)
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1
      with:
        xcode-version: '27.0'
    - name: pod lib lint (Xcode 27)
      # Xcode builds and SPM never reject a stale deployment target, only a
      # CocoaPods pod target does, so this is the check that guards the iOS 15 floor.
      run: pod lib lint MixpanelSessionReplay.podspec --allow-warnings
